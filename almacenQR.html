<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlmacenScan</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
 :root{--fondo:#0f1720;--panel:#17212c;--borde:#2a3846;--texto:#e8eef4;--suave:#8fa3b5;
       --acento:#2dd4bf;--rojo:#f87171;--ambar:#fbbf24;--verde:#4ade80}
 *{box-sizing:border-box}
 body{margin:0;background:var(--fondo);color:var(--texto);font-family:Segoe UI,Arial,sans-serif}
 header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;
        border-bottom:1px solid var(--borde)}
 header h1{margin:0;font-size:20px;letter-spacing:.5px}
 header h1 span{color:var(--acento)}
 .resumen{display:flex;gap:18px;font-size:13px;color:var(--suave)}
 .resumen b{color:var(--texto);font-size:16px;display:block}
 main{max-width:1100px;margin:0 auto;padding:18px;display:grid;grid-template-columns:360px 1fr;gap:18px}
 @media(max-width:850px){main{grid-template-columns:1fr}}
 .panel{background:var(--panel);border:1px solid var(--borde);border-radius:12px;padding:16px;margin-bottom:18px}
 .panel h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--suave)}
 button{font:inherit;cursor:pointer;border:1px solid var(--borde);background:#22303d;color:var(--texto);
        padding:9px 14px;border-radius:8px}
 button:hover{border-color:var(--acento)}
 button.principal{background:var(--acento);color:#04211d;border-color:var(--acento);font-weight:600}
 button.peligro{color:var(--rojo)}
 input,select{font:inherit;width:100%;padding:9px;border-radius:8px;border:1px solid var(--borde);
        background:#0f1720;color:var(--texto)}
 label{font-size:12px;color:var(--suave);display:block;margin:10px 0 4px}
 .modo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
 .modo button.on{background:var(--acento);color:#04211d;border-color:var(--acento);font-weight:600}
 .modo button.on.sal{background:var(--ambar);border-color:var(--ambar)}
 #visor{width:100%;min-height:60px;border-radius:8px;overflow:hidden;background:#000;margin-bottom:10px}
 #estado{font-size:13px;color:var(--suave);margin-bottom:10px}
 .fila{display:flex;gap:8px}
 .tarjeta{border:1px solid var(--borde);border-radius:10px;padding:14px;background:#0f1720}
 .tarjeta h3{margin:0 0 2px}
 .cod{color:var(--suave);font-size:12px;font-family:monospace}
 .grande{font-size:40px;font-weight:700;color:var(--acento);text-align:center;margin:8px 0}
 .ctrl{display:flex;justify-content:center;gap:10px;margin-bottom:10px}
 .ctrl button{width:48px;font-size:20px}
 .chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600}
 .ok{background:#143d2a;color:var(--verde)} .bajo{background:#46380f;color:var(--ambar)}
 .cero{background:#472020;color:var(--rojo)}
 .tabs{display:flex;gap:6px;margin-bottom:12px}
 .tabs button.on{border-color:var(--acento);color:var(--acento)}
 table{width:100%;border-collapse:collapse;font-size:13px}
 th{text-align:left;color:var(--suave);font-weight:500;padding:8px;border-bottom:1px solid var(--borde)}
 td{padding:8px;border-bottom:1px solid #1f2b37}
 tr.sel td{background:#1d2c3a}
 #aviso{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--acento);
        color:#04211d;padding:10px 18px;border-radius:8px;font-weight:600;display:none}
 #aviso.err{background:var(--rojo)}
 dialog{background:var(--panel);color:var(--texto);border:1px solid var(--borde);border-radius:12px;width:340px}
 dialog::backdrop{background:#000a}
</style></head><body>

<header>
 <h1>Almacen<span>Scan</span></h1>
 <div class="resumen">
  <div><b id="rProd">0</b>productos</div>
  <div><b id="rUni">0</b>unidades</div>
  <div><b id="rVal">$0</b>valor</div>
  <div><b id="rBajo">0</b>stock bajo</div>
 </div>
</header>

<main>
 <section>
  <div class="panel">
   <h2>Escaner</h2>
   <div class="modo">
    <button id="mEnt" class="on" onclick="setModo('entrada')">+ Entrada</button>
    <button id="mSal" onclick="setModo('salida')">- Salida</button>
   </div>
   <div id="visor"></div>
   <div id="estado">Camara apagada</div>
   <div class="fila"><button class="principal" id="btnCam" onclick="toggleCamara()">Activar camara</button></div>
   <label>O escribe / escanea con lector USB</label>
   <div class="fila">
    <input id="manual" placeholder="Codigo de barras" autocomplete="off">
    <button onclick="buscarManual()">Buscar</button>
   </div>
  </div>

  <div class="panel" id="panelProd">
   <h2>Producto</h2>
   <div id="detalle" style="color:var(--suave);font-size:14px">Escanea un producto para ver sus datos.</div>
  </div>
 </section>

 <section>
  <div class="panel">
   <div class="tabs">
    <button id="tInv" class="on" onclick="verTab('inv')">Inventario</button>
    <button id="tMov" onclick="verTab('mov')">Movimientos</button>
    <span style="flex:1"></span>
    <button onclick="exportarCSV()">Exportar CSV</button>
   </div>
   <div id="vInv">
    <input id="buscar" placeholder="Buscar por nombre, categoria o codigo" oninput="cargar()" style="margin-bottom:10px">
    <table><thead><tr><th>Producto</th><th>Categoria</th><th>Precio</th><th>Cant.</th><th>Estado</th><th></th></tr></thead>
    <tbody id="lista"></tbody></table>
   </div>
   <div id="vMov" style="display:none">
    <table><thead><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cant.</th></tr></thead>
    <tbody id="listaMov"></tbody></table>
   </div>
  </div>
 </section>
</main>

<dialog id="dlg">
 <h3 id="dlgTit" style="margin-top:0">Producto</h3>
 <label>Codigo</label><input id="fCodigo" disabled>
 <label>Nombre</label><input id="fNombre">
 <label>Categoria</label><input id="fCategoria" list="cats">
 <datalist id="cats"></datalist>
 <div class="fila">
  <div><label>Precio</label><input id="fPrecio" type="number" step="0.01"></div>
  <div><label>Cantidad</label><input id="fCantidad" type="number"></div>
  <div><label>Minimo</label><input id="fMinimo" type="number"></div>
 </div>
 <div class="fila" style="margin-top:14px;justify-content:flex-end">
  <button onclick="dlg.close()">Cancelar</button>
  <button class="principal" onclick="guardarForm()">Guardar</button>
 </div>
</dialog>

<dialog id="dlgDel">
 <h3 style="margin-top:0">Eliminar producto</h3>
 <p id="delTxt"></p>
 <div class="fila" style="justify-content:flex-end">
  <button onclick="dlgDel.close()">Cancelar</button>
  <button class="peligro" onclick="confirmarDel()">Eliminar</button>
 </div>
</dialog>

<div id="aviso"></div>

<script>
const $ = id => document.getElementById(id);
let modo = 'entrada', camara = null, camaraOn = false, ultimo = '', ultimoT = 0, actual = null, borrarCodigo = '';

function aviso(t, err){
  const a = $('aviso'); a.textContent = t; a.className = err ? 'err' : ''; a.style.display = 'block';
  clearTimeout(a._t); a._t = setTimeout(() => a.style.display = 'none', 2200);
}
function pitido(){
  try{ const c = new (window.AudioContext||window.webkitAudioContext)(), o = c.createOscillator();
    o.frequency.value = 880; o.connect(c.destination); o.start(); setTimeout(() => o.stop(), 90);}catch(e){}
}
/* ---------- datos guardados en el navegador (localStorage) ---------- */
const CLAVE = 'almacenscan_v1';
let memoria = null;
function leerDB(){
  try{ const t = localStorage.getItem(CLAVE); if (t) return JSON.parse(t); }catch(e){}
  return memoria || {p:{}, m:[]};
}
function guardarDB(db){
  memoria = db;
  try{ localStorage.setItem(CLAVE, JSON.stringify(db)); }catch(e){}
}
function ahora(){
  const d = new Date(), z = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes())+':'+z(d.getSeconds());
}
function mover(db, codigo, delta, tipo){
  const p = db.p[codigo]; if (!p) return null;
  const nueva = Math.max(0, p.cantidad + delta), real = nueva - p.cantidad;
  p.cantidad = nueva; p.actualizado = ahora();
  if (real !== 0) db.m.unshift({codigo, nombre:p.nombre, tipo, cantidad:Math.abs(real), fecha:ahora()});
  db.m = db.m.slice(0, 200);
  return p;
}
const api = async (url, metodo='GET', d) => {
  const u = new URL(url, 'http://local'), q = u.searchParams, ruta = u.pathname, db = leerDB();
  if (ruta === '/api/productos'){
    const t = (q.get('q') || '').toLowerCase();
    return Object.values(db.p).filter(p => (p.nombre + p.codigo + p.categoria).toLowerCase().includes(t))
      .sort((a, b) => b.actualizado.localeCompare(a.actualizado));
  }
  if (ruta === '/api/resumen'){
    const l = Object.values(db.p);
    return {productos:l.length, unidades:l.reduce((s,p)=>s+p.cantidad,0),
      valor:l.reduce((s,p)=>s+p.cantidad*p.precio,0), bajos:l.filter(p=>p.cantidad<=p.minimo).length,
      categorias:[...new Set(l.map(p=>p.categoria).filter(Boolean))].sort()};
  }
  if (ruta === '/api/movimientos') return db.m;
  if (ruta === '/api/producto'){
    const cod = q.get('codigo');
    if (metodo === 'GET') return db.p[cod] || {error:'no existe'};
    if (metodo === 'DELETE'){ delete db.p[cod]; guardarDB(db); return {mensaje:'Producto eliminado'}; }
    if (metodo === 'POST'){
      if (db.p[d.codigo]) return {error:'El codigo ya existe'};
      db.p[d.codigo] = {codigo:d.codigo, nombre:d.nombre, categoria:d.categoria, precio:d.precio,
        cantidad:d.cantidad, minimo:d.minimo, actualizado:ahora()};
      if (d.cantidad > 0) db.m.unshift({codigo:d.codigo, nombre:d.nombre, tipo:'entrada', cantidad:d.cantidad, fecha:ahora()});
      guardarDB(db); return {producto: db.p[d.codigo]};
    }
    if (metodo === 'PUT'){
      Object.assign(db.p[d.codigo], {nombre:d.nombre, categoria:d.categoria, precio:d.precio,
        cantidad:d.cantidad, minimo:d.minimo, actualizado:ahora()});
      guardarDB(db); return {producto: db.p[d.codigo]};
    }
  }
  if (ruta === '/api/escaneo'){
    const p = db.p[d.codigo];
    if (!p) return d.modo === 'salida' ? {error:'Ese producto no esta registrado', producto:null} : {nuevo:true};
    const antes = p.cantidad;
    mover(db, d.codigo, d.modo === 'entrada' ? 1 : -1, d.modo); guardarDB(db);
    if (d.modo === 'salida' && antes === 0) return {error:'Sin existencias', producto:p};
    return {producto:p};
  }
  if (ruta === '/api/ajuste'){
    const p = mover(db, d.codigo, d.delta, d.delta > 0 ? 'entrada' : 'salida'); guardarDB(db); return {producto:p};
  }
  return {error:'ruta invalida'};
};
function exportarCSV(){
  const l = Object.values(leerDB().p);
  const f = v => '"' + String(v).replace(/"/g, '""') + '"';
  const filas = [['codigo','nombre','categoria','precio','cantidad','minimo','actualizado']]
    .concat(l.map(p => [p.codigo,p.nombre,p.categoria,p.precio,p.cantidad,p.minimo,p.actualizado]));
  const blob = new Blob(['﻿' + filas.map(r => r.map(f).join(',')).join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'inventario.csv'; a.click();
}

const dinero = n => '$' + Number(n).toFixed(2);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function setModo(m){
  modo = m;
  $('mEnt').className = m === 'entrada' ? 'on' : '';
  $('mSal').className = m === 'salida' ? 'on sal' : '';
}

/* ---------- camara ---------- */
async function toggleCamara(){
 if (camaraOn){ await camara.stop(); camaraOn = false;
  $('btnCam').textContent = 'Activar camara';$('estado').textContent = 'Camara apagada'; return; }
 if (typeof Html5Qrcode === 'undefined'){ aviso('No cargo la libreria de camara (revisa internet)', true); return; }
 
 camara = camara || new Html5Qrcode('visor');
 const config = {fps:10, qrbox:{width:260, height:120}};
 
 try {
  // 1. CELULARES: Intenta abrir la cámara trasera primero
  await camara.start({facingMode:'environment'}, config, txt => procesar(txt), () => {});
  $('estado').textContent = 'Camara activa (Trasera)';
 } catch(e1) {
   try {
     // 2. LAPTOPS: Si no hay trasera, intenta abrir la frontal
     await camara.start({facingMode:'user'}, config, txt => procesar(txt), () => {});
     $('estado').textContent = 'Camara activa (Frontal)';
   } catch(e2) {
     try {
       // 3. PC DE ESCRITORIO: Si no reconoce orientación, busca cualquier cámara USB
       const dispositivos = await Html5Qrcode.getCameras();
       if (dispositivos && dispositivos.length > 0) {
         await camara.start(dispositivos[0].id, config, txt => procesar(txt), () => {});
         $('estado').textContent = 'Camara activa (PC/USB)';
       } else {
         throw new Error('Cero camaras detectadas');
       }
     } catch(e3) {
       $('estado').textContent = 'No se encontro ninguna camara'; 
       aviso('Asegurate de que la camara este conectada y con permisos', true);
       return; // Sale sin cambiar el estado del boton
     }
   }
  }
}

function buscarManual(){ const c = $('manual').value.trim(); if (c){ procesar(c); $('manual').value = ''; } }
$('manual').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); buscarManual(); } });

/* ---------- logica de escaneo ---------- */
async function procesar(codigo){
  const ahora = Date.now();
  if (codigo === ultimo && ahora - ultimoT < 2000) return;   // evita lecturas repetidas de la camara
  ultimo = codigo; ultimoT = ahora;
  const r = await api('/api/escaneo', 'POST', {codigo, modo});
  pitido();
  if (r.nuevo){
    aviso('Producto nuevo: completa sus datos');
    abrirForm({codigo, nombre:'', categoria:'', precio:0, cantidad:1, minimo:5}, true);
  } else if (r.error){
    aviso(r.error, true); mostrar(r.producto);
  } else {
    aviso((modo === 'entrada' ? '+1 ' : '-1 ') + r.producto.nombre);
    mostrar(r.producto);
  }
  cargar();
}

/* ---------- detalle ---------- */
function estado(p){
  if (p.cantidad === 0) return '<span class="chip cero">Agotado</span>';
  if (p.cantidad <= p.minimo) return '<span class="chip bajo">Stock bajo</span>';
  return '<span class="chip ok">Disponible</span>';
}
function mostrar(p){
  actual = p; if (!p){ return; }
  $('detalle').innerHTML = `
   <div class="tarjeta">
    <h3>${esc(p.nombre)}</h3><div class="cod">${esc(p.codigo)} · ${esc(p.categoria || 'Sin categoria')}</div>
    <div class="grande">${p.cantidad}</div>
    <div class="ctrl"><button onclick="ajustar(-1)">-</button><button onclick="ajustar(1)">+</button></div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span>${dinero(p.precio)}</span>${estado(p)}</div>
    <div class="fila" style="margin-top:12px">
      <button style="flex:1" onclick='editar(${JSON.stringify(p.codigo)})'>Editar</button>
    </div>
   </div>`;
}
async function ajustar(d){
  if (!actual) return;
  const r = await api('/api/ajuste', 'POST', {codigo: actual.codigo, delta: d});
  mostrar(r.producto); cargar();
}

/* ---------- formulario ---------- */
let esNuevo = false;
function abrirForm(p, nuevo){
  esNuevo = nuevo;
  $('dlgTit').textContent = nuevo ? 'Nuevo producto' : 'Editar producto';
  $('fCodigo').value = p.codigo; $('fNombre').value = p.nombre; $('fCategoria').value = p.categoria;
  $('fPrecio').value = p.precio; $('fCantidad').value = p.cantidad; $('fMinimo').value = p.minimo;
  $('dlg').showModal(); $('fNombre').focus();
}
async function editar(codigo){ const p = await api('/api/producto?codigo=' + encodeURIComponent(codigo)); abrirForm(p, false); }
async function guardarForm(){
  const d = {codigo: $('fCodigo').value, nombre: $('fNombre').value.trim(), categoria: $('fCategoria').value.trim(),
    precio: parseFloat($('fPrecio').value) || 0, cantidad: parseInt($('fCantidad').value) || 0,
    minimo: parseInt($('fMinimo').value) || 0};
  if (!d.nombre){ aviso('Falta el nombre', true); return; }
  const r = await api('/api/producto', esNuevo ? 'POST' : 'PUT', d);
  $('dlg').close(); mostrar(r.producto); cargar();
  aviso(esNuevo ? 'Producto registrado' : 'Producto actualizado');
}

/* ---------- eliminar ---------- */
function pedirDel(codigo, nombre){ borrarCodigo = codigo; $('delTxt').textContent = 'Se borrara "' + nombre + '" del inventario.'; $('dlgDel').showModal(); }
async function confirmarDel(){
  await api('/api/producto?codigo=' + encodeURIComponent(borrarCodigo), 'DELETE');
  $('dlgDel').close(); if (actual && actual.codigo === borrarCodigo){ actual = null;
    $('detalle').textContent = 'Escanea un producto para ver sus datos.'; }
  cargar(); aviso('Producto eliminado');
}

/* ---------- listas ---------- */
function verTab(t){
  $('vInv').style.display = t === 'inv' ? '' : 'none'; $('vMov').style.display = t === 'mov' ? '' : 'none';
  $('tInv').className = t === 'inv' ? 'on' : ''; $('tMov').className = t === 'mov' ? 'on' : ''; cargar();
}
async function cargar(){
  const lista = await api('/api/productos?q=' + encodeURIComponent($('buscar').value));
  $('lista').innerHTML = lista.length ? lista.map(p => `
   <tr class="${actual && actual.codigo === p.codigo ? 'sel' : ''}">
    <td><a href="#" style="color:inherit;text-decoration:none" onclick='mostrar(${JSON.stringify(p)});return false'>
      <b>${esc(p.nombre)}</b></a><div class="cod">${esc(p.codigo)}</div></td>
    <td>${esc(p.categoria)}</td><td>${dinero(p.precio)}</td><td>${p.cantidad}</td><td>${estado(p)}</td>
    <td><button class="peligro" onclick='pedirDel(${JSON.stringify(p.codigo)},${JSON.stringify(p.nombre)})'>Eliminar</button></td>
   </tr>`).join('') : '<tr><td colspan="6" style="color:var(--suave)">Todavia no hay productos.</td></tr>';
  const res = await api('/api/resumen');
  $('rProd').textContent = res.productos; $('rUni').textContent = res.unidades;
  $('rVal').textContent = '$' + Number(res.valor).toFixed(0); $('rBajo').textContent = res.bajos;
  $('cats').innerHTML = res.categorias.map(c => `<option value="${esc(c)}">`).join('');
  if ($('vMov').style.display !== 'none'){
    const m = await api('/api/movimientos');
    $('listaMov').innerHTML = m.map(x => `<tr><td>${x.fecha}</td><td>${esc(x.nombre)}</td>
      <td>${x.tipo}</td><td>${x.cantidad}</td></tr>`).join('') || '<tr><td colspan="4" style="color:var(--suave)">Sin movimientos.</td></tr>';
  }
}
cargar();
</script></body></html>
